<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DeepView</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class="navbar">
        <img src="img/logo.jpg" class="logo">
        <nav>
            <a href="#">Главная</a>
            <a href="#">Сериалы</a>
            <a href="#">Фильмы</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Game of Thrones</h1>
            <p>«Игра престолов» — культовый фэнтезийный
            сериал HBO, основанный на книгах Джорджа Р. Р. Мартина...</p>
            <div class="buttons">
                <button class="play">Смотреть</button>
                <button class="info">Подробнее</button>
            </div>
        </div>
    </section>

    <section class="row">
        <h2>Популярное на DeepView</h2>
        <div class="movie-grid">
            <div class="movie-card"><img src="img/1.jpg"><p>Волк с Уолл-Стрит</p></div>
            <div class="movie-card"><img src="img/2.jpg"><p>Звёздные войны Эпизод 9</p></div>
            <div class="movie-card"><img src="img/3.jpg"><p>Бугущие по Лезвию 2049</p></div>
        </div>
    </section>
</body>
</html>
