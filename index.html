<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DeepView</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class="navbar">
        <nav>
            <img src="img/logo.jpg" class="logo">
            <a href="#">Главная</a>
            <a href="#">Сериалы</a>
            <a href="#">Фильмы</a>
            <form>
                <input type="text" class="header_search" placeholder="Поиск" />
            </form>
            <div class="user-profile">
                <img src="img/logo.jpg" class="profile-circle">
            </div>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Game of Thrones</h1>
            <p>«Игра престолов» — культовый фэнтезийный
            сериал HBO, основанный на книгах Джорджа Р. Р. Мартина...</p>
            <div class="buttons">
                <button class="play">Смотреть</button>
                <button class="info">Подробнее</button>
            </div>
        </div>
    </section>
    <section class="row">
        <h2>Фильмы на DeepView</h2>
        <div class="movie-grid">
            
        </div>
    </section>   

    <script src="script.js"></script>
</body>
</html>
